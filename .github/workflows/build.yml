name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Commandline Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          rm cmdline-tools.zip
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Grant execute permission for build.sh
        run: |
          if [ -f "OfflineDict/build.sh" ]; then
            chmod +x OfflineDict/build.sh
          elif [ -f "build.sh" ]; then
            chmod +x build.sh
          fi

      - name: Build APK with build.sh
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          if [ -f "OfflineDict/build.sh" ]; then
            cd OfflineDict && ./build.sh
          else
            ./build.sh
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineDict-apk
          path: |
            **/*.apk
